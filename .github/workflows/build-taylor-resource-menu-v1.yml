name: Build Taylor Resource Menu V1
on:
  push:
    branches: [feature/taylor-resource-menu-v1]
    paths: ['taylor-resource-menu-v1/**', '.github/workflows/build-taylor-resource-menu-v1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: taylor-resource-menu-v1
    steps:
      - uses: actions/checkout@v4
      - name: Build signed iOS arm64 dylib with embedded Dobby
        run: sh build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TaylorResourceMenu-V1-ios-arm64
          path: |
            taylor-resource-menu-v1/TaylorResourceMenu-V1.dylib
            taylor-resource-menu-v1/SHA256SUMS.txt
            taylor-resource-menu-v1/README.md
            taylor-resource-menu-v1/Dobby-LICENSE.txt
          if-no-files-found: error
