name: Build Hollywood LuaRuntimeHook V2
on:
  push:
    branches: [feature/hollywood-lua-runtime-v1]
    paths:
      - 'hollywood-lua-runtime-v2/**'
      - '.github/workflows/build-hollywood-lua-v2.yml'
  workflow_dispatch:
jobs:
  build-lua-v2:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect iOS arm64 dylib
        shell: bash
        run: |
          set -euxo pipefail
          cd hollywood-lua-runtime-v2
          sh build_macos.sh
          mkdir -p ../dist/hollywood-lua-v2
          cp LuaRuntimeHookV2.dylib ../dist/hollywood-lua-v2/
          codesign --force --sign - --timestamp=none ../dist/hollywood-lua-v2/LuaRuntimeHookV2.dylib
          file ../dist/hollywood-lua-v2/LuaRuntimeHookV2.dylib
          xcrun otool -hv ../dist/hollywood-lua-v2/LuaRuntimeHookV2.dylib
          shasum -a 256 ../dist/hollywood-lua-v2/LuaRuntimeHookV2.dylib | tee ../dist/hollywood-lua-v2/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Hollywood-LuaRuntimeHook-V2
          path: dist/hollywood-lua-v2/
          if-no-files-found: error
