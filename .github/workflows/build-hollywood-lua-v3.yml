name: Build Hollywood LuaRuntimeHook V3
on:
  push:
    branches: [feature/hollywood-lua-runtime-v1]
    paths:
      - 'hollywood-lua-runtime-v3/**'
      - '.github/workflows/build-hollywood-lua-v3.yml'
  workflow_dispatch:
jobs:
  build-lua-v3:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect iOS arm64 dylib
        shell: bash
        run: |
          set -euxo pipefail
          cd hollywood-lua-runtime-v3
          sh build_macos.sh
          mkdir -p ../dist/hollywood-lua-v3
          cp LuaRuntimeHookV3.dylib ../dist/hollywood-lua-v3/
          codesign --force --sign - --timestamp=none ../dist/hollywood-lua-v3/LuaRuntimeHookV3.dylib
          file ../dist/hollywood-lua-v3/LuaRuntimeHookV3.dylib
          xcrun otool -hv ../dist/hollywood-lua-v3/LuaRuntimeHookV3.dylib
          xcrun nm -g ../dist/hollywood-lua-v3/LuaRuntimeHookV3.dylib | grep LuaHookV3_Request
          shasum -a 256 ../dist/hollywood-lua-v3/LuaRuntimeHookV3.dylib | tee ../dist/hollywood-lua-v3/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Hollywood-LuaRuntimeHook-V3
          path: dist/hollywood-lua-v3/
          if-no-files-found: error
