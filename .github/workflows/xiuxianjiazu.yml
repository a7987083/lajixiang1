name: Build Xiuxianjiazu GM UI
on:
  push:
    branches: [xiuxianjiazu, feat/xiuxianjiazu-native-item-search, feat/xiuxianjiazu-item-catalog-v1, fix/xiuxianjiazu-item-export-crash-v1, fix/xiuxianjiazu-item-export-array-v1-2, fix/xiuxianjiazu-item-export-field-args-v1-3, feat/xiuxianjiazu-external-json-ui, feat/xiuxianjiazu-gm-menu-shell, feat/xiuxianjiazu-gm-item-send-v1, fix/xiuxianjiazu-send-ui-v1-1, feat/xiuxianjiazu-skill-catalog-menu-p2-1-2, feat/xiuxianjiazu-actor-list-p2-1-4, feat/xiuxianjiazu-live-actor-skill-p2-1-5, fix/xiuxianjiazu-hide-catalog-metadata-p2-1-6, feat/xiuxianjiazu-actor-attributes-p2-2-1, feat/xiuxianjiazu-live-actor-attr-p2-2-2, feat/xiuxianjiazu-attr-write-p2-2-3, fix/xiuxianjiazu-attr-inline-feedback-p2-2-4, feat/xiuxianjiazu-attr-percent-range-audit-p2-2-5, feat/xiuxianjiazu-persistence-diagnostic-p2-3-1, fix/xiuxianjiazu-attr-helper-resolve-p2-3-2, fix/xiuxianjiazu-attr-regression-ui-p2-3-3, feat/xiuxianjiazu-attribute-lock-p2-4-1, fix/xiuxianjiazu-lock-1s-multi-p2-4-2, fix/xiuxianjiazu-attr-auto-refresh-p2-4-3, fix/xiuxianjiazu-lock-stability-p2-4-4, feat/xiuxianjiazu-attribute-ui-p2-5, refactor/xiuxianjiazu-runtime-cleanup-p2-6, fix/xiuxianjiazu-remove-reload-p2-6-1, feat/xiuxianjiazu-bloodline-p2-7-1, feat/xiuxianjiazu-bloodline-write-p2-7-2]
    paths:
      - 'xiuxianjiazu/**'
      - '.github/workflows/xiuxianjiazu.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS dylib
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p dist
          xcrun clang++ -std=c++17 -fobjc-arc -arch arm64 -dynamiclib \
            -isysroot "$SDK" -miphoneos-version-min=13.0 \
            -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics \
            -Wl,-install_name,@rpath/XiuxianjiazuGM.dylib \
            xiuxianjiazu/XJGMMenu.mm xiuxianjiazu/XJGMItemSender.mm xiuxianjiazu/XJGMActorExport.mm xiuxianjiazu/XJGMAttrExport.mm xiuxianjiazu/XJGMBloodExport.mm xiuxianjiazu/XJGMBloodWriter.mm -o dist/XiuxianjiazuGM.dylib
          codesign --force --sign - --timestamp=none dist/XiuxianjiazuGM.dylib
          file dist/XiuxianjiazuGM.dylib
          shasum -a 256 dist/XiuxianjiazuGM.dylib > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: XiuxianjiazuGM-arm64
          path: dist/*
