name: 1945 Air Force GM
on:
  push:
    branches: [1945AirForcegm]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p dist
          xcrun clang++ -std=c++17 -fobjc-arc -arch arm64 -dynamiclib -isysroot "$SDK" -miphoneos-version-min=13.0 -framework UIKit -framework Foundation -framework CoreGraphics -Wl,-install_name,@rpath/1945AirForceGM.dylib 1945AirForce/GMRuntime.mm -o dist/1945AirForceGM.dylib
          codesign --force --sign - --timestamp=none dist/1945AirForceGM.dylib
          file dist/1945AirForceGM.dylib
          shasum -a 256 dist/1945AirForceGM.dylib | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 1945AirForceGM-arm64
          path: |
            dist/1945AirForceGM.dylib
            dist/SHA256SUMS.txt
