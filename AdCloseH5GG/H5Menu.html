<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>body{background:#101824;color:#e4edf6;font:15px -apple-system,sans-serif;margin:0;padding:15px}h3{margin:0 0 12px}button{padding:13px;width:100%;margin:6px 0;border:0;border-radius:9px;background:#355a83;color:white;font-size:16px}.danger{background:#c23b48}#result{font:12px monospace;white-space:pre-wrap;word-break:break-all;padding:10px;color:#a7b6c8}</style></head><body><h3>Unity Ads 关闭测试</h3><button onclick="run('status')">检测广告</button><button class="danger" onclick="run('closeAd')">测试关闭</button><div id="result">仅测试 UIKit dismiss；不触发奖励回调。</div><script>let plugin=null;function run(name){let e=document.getElementById('result');try{if(!plugin){if(typeof h5gg==='undefined')throw Error('H5GG 未加载');plugin=h5gg.loadPlugin('AdCloseBridge','AdCloseBridge.dylib');if(!plugin)throw Error('AdCloseBridge.dylib 加载失败');}e.textContent=String(plugin[name]());}catch(err){e.textContent='ERROR: '+err.message;}}</script></body></html>
